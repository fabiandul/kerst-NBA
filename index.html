<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e2a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LeCoins">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>LeCoins Kerst NBA</title>
<style>
:root{--bg:#0e2a1f;--card:#16392b;--card2:#1d4636;--red:#c8102e;--gold:#f5c542;--txt:#f4f1e8;--mut:#9fb8aa;--ok:#4cd07d;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#14402f,#0a1d15);background-attachment:fixed;color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:26px;margin:6px 0}
h2{font-size:19px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 6px}
.snow{text-align:center;font-size:22px;letter-spacing:6px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.coins{background:var(--card2);border:2px solid var(--gold);border-radius:14px;padding:8px 14px;text-align:right}
.coins b{color:var(--gold);font-size:22px}
.coins small{display:block;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:10px 0;position:sticky;top:0;background:#0b2118;padding:6px 0;z-index:5;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs button{flex:0 0 auto;padding:12px 14px;border:0;border-radius:12px;background:var(--card);color:var(--txt);font-size:15px;font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--red)}
.tabs.adm{flex-wrap:wrap;overflow-x:visible}
.tabs.adm button{flex:1 1 auto;padding:10px 8px;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 2px 10px #0006}
.muted{color:var(--mut);font-size:13px}
.bet{border-top:1px solid #ffffff22;margin-top:12px;padding-top:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:8px}
.opt{background:var(--card2);border:2px solid transparent;border-radius:12px;color:var(--txt);padding:12px 8px;font-size:15px;font-weight:600}
.opt span{display:block;color:var(--gold);font-size:20px}
.opt.sel{border-color:var(--gold);background:#2a5a45}
.opt.mine{border-color:var(--ok)}
.opt:disabled{opacity:.55}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;background:var(--red);color:#fff}
.btn.gold{background:var(--gold);color:#222}
.btn.grey{background:#3a5a4b}
.btn.small{padding:7px 10px;font-size:13px}
.btn.green{background:#2f9e5a}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #ffffff33;background:#0c2a1f;color:var(--txt);font-size:16px}
input.sc{width:54px;padding:8px 4px;text-align:center}
textarea{min-height:70px;font-family:inherit}
label{display:block;margin:8px 0 3px;color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row>.btn{flex:0 0 auto;max-width:100%}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#3a5a4b}
.pill.won{background:var(--ok);color:#06240f}.pill.lost{background:var(--bad);color:#2b0505}.pill.pending{background:var(--gold);color:#2a2200}.pill.concept{background:#7a4fd0}
.err{background:#5b1620;border:1px solid var(--bad);padding:10px;border-radius:10px;margin:10px 0}
.info{background:#1d4636;border:1px solid var(--gold);padding:10px;border-radius:10px;margin:10px 0;font-size:14px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.name{padding:26px 8px;font-size:22px;font-weight:800;border-radius:18px;border:3px solid var(--gold);background:var(--card2);color:var(--txt)}
.name.adm{border-color:var(--red)}
.name.new{border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px 4px;border-bottom:1px solid #ffffff1a;text-align:left}
.rank{display:flex;justify-content:space-between;padding:12px;border-radius:12px;background:var(--card2);margin:6px 0;font-size:18px}
.title-box{display:flex;gap:10px;align-items:center;background:var(--card2);border-radius:12px;padding:10px;margin:8px 0}
.title-box .em{font-size:28px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.conf span{position:absolute;top:-40px;font-size:26px;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--card);border:3px solid var(--gold);border-radius:20px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
#intro{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center}
#intro[hidden]{display:none}
#intro video{width:100%;height:100%;object-fit:contain;background:#000}
#introClose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px}
#introStopAll{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px}
#introSound{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
#introTap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;padding:16px 22px}
#intro button[hidden]{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, writeBatch, increment } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const ADMIN_CODE = "Legoat";
const START_COINS = 1000;
const MIN_STAKE = 1;
const MAX_STAKE = 200;
const MAX_ODDS = 15;
const DEFAULT_NAMES = ["Fabian", "Laurens", "Roy"];
const GENERAL_ID = "algemeen";
const DEFAULT_CODES = { Roy: "FUCKPAULGEORGE", Laurens: "minderppgdanduke", Fabian: "LebronJames" };

const firebaseConfig = {
  apiKey: "AIzaSyCqa_X6wnxdtXkkVavwUvAgDy8hKk_hWS0",
  authDomain: "nba-kerst-games.firebaseapp.com",
  projectId: "nba-kerst-games",
  storageBucket: "nba-kerst-games.firebasestorage.app",
  messagingSenderId: "942941234856",
  appId: "1:942941234856:web:01d1093bc59f8f73c4c49d"
};
const db = getFirestore(initializeApp(firebaseConfig));

const S = { me: localStorage.getItem("lc_me") || null, admin: sessionStorage.getItem("lc_admin") === "1",
  tab: null, atab: "over", players: [], games: [], bets: [], wagers: [], sel: null, stake: "", err: "", form: {}, dirty: false,
  notice: null, confetti: "", res: {}, loginFor: null, loginErr: "", settings: {}, oddsMsg: {} };
if (S.me === "admin" && !S.admin) S.me = null;
let unsubW = null;
const $app = document.getElementById("app");

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Math.round(n).toLocaleString("nl-NL");
const fdate = t => new Date(t).toLocaleString("nl-NL", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const F = (id, def = "") => (id in S.form ? S.form[id] : def);
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const sg = n => (n > 0 ? "+" : "") + Number(n).toFixed(1);
const fail = e => { console.error(e); S.err = "Fout: " + (e.message || e); render(); };
const isGen = g => !!g && g.kind === "general";
const gLabel = g => !g ? "" : isGen(g) ? "Algemeen" : g.away + " @ " + g.home;
const gameOf = id => S.games.find(g => g.id === id);
const capOf = b => Math.min(MAX_STAKE, b.maxStake > 0 ? b.maxStake : MAX_STAKE);
const isOpen = (b, g) => !!g && !g.closed && b.status === "open" && b.published !== false;
const player = n => S.players.find(p => p.name === n);
const pendingStake = () => S.wagers.filter(w => w.status === "pending").reduce((s, w) => s + w.stake, 0);
const available = () => (player(S.me)?.coins ?? 0) - pendingStake();
const myWager = betId => S.wagers.find(w => w.id === betId + "__" + S.me);
const fair2 = (a, b) => { const pa = 1 / a, pb = 1 / b, t = pa + pb; return [t / pa, t / pb]; };
const payoutOf = w => Math.round(w.stake * w.odds);
const nkey = w => w.id + ":" + (w.settledAt || 0);
const getSeen = () => { try { return JSON.parse(localStorage.getItem("lc_seen_" + S.me) || "[]"); } catch (e) { return []; } };
const setSeen = a => { try { localStorage.setItem("lc_seen_" + S.me, JSON.stringify(a)); } catch (e) {} };

// ---------- data ----------
function listen(name, key, sortFn) {
  onSnapshot(collection(db, name), snap => {
    S[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (sortFn) S[key].sort(sortFn);
    S.err = ""; render();
  }, e => fail(e));
}
listen("games", "games", (a, b) => (a.start || 0) - (b.start || 0));
listen("bets", "bets", (a, b) => (a.order || 0) - (b.order || 0) || (a.created || 0) - (b.created || 0));
listen("players", "players", (a, b) => b.coins - a.coins);
onSnapshot(doc(db, "settings", "main"), snap => { S.settings = snap.exists() ? snap.data() : {}; handleIntro(); render(); }, e => fail(e));

// ---------- intro-video (admin start hem bij iedereen die de app open heeft) ----------
const INTRO_SRC = "lecoins-intro.mp4?v=1";
const INTRO_WINDOW = 3 * 60 * 1000;
const introEl = document.createElement("div");
introEl.id = "intro";
introEl.hidden = true;
introEl.innerHTML = `<video src="${INTRO_SRC}" playsinline preload="none"></video>
<button class="btn grey small" id="introClose">✕ Sluiten</button>
<button class="btn small" id="introStopAll" hidden>■ Stop bij iedereen</button>
<button class="btn gold" id="introSound" hidden>🔊 Tik voor geluid</button>
<button class="btn gold" id="introTap" hidden>▶ Tik om de intro te starten</button>`;
document.body.appendChild(introEl);
const introV = introEl.querySelector("video");
const introBtn = id => introEl.querySelector("#" + id);
let introBase, introPlayed = null, introMode = null, introUnlocked = false;

// Telefoons (vooral iPhones) spelen geluid alleen af na een tik. Bij de eerste tik in de app
// starten we de video heel even zonder geluid, zodat hij later wel met geluid mag starten.
function unlockIntro() {
  if (introUnlocked || !introEl.hidden) return;
  introUnlocked = true;
  introV.muted = true;
  const p = introV.play();
  if (p) p.then(() => { if (introEl.hidden) { introV.pause(); introV.currentTime = 0; introV.muted = false; } })
    .catch(() => { introV.muted = false; introUnlocked = false; });
}
document.addEventListener("pointerdown", unlockIntro, true);

async function openIntro(mode) {
  introMode = mode;
  introEl.hidden = false;
  introBtn("introSound").hidden = true;
  introBtn("introTap").hidden = true;
  introBtn("introStopAll").hidden = !(S.admin && mode === "live");
  introV.currentTime = 0;
  introV.muted = false;
  try { await introV.play(); }
  catch (e) {
    introV.muted = true;
    try { await introV.play(); introBtn("introSound").hidden = false; }
    catch (e2) { introBtn("introTap").hidden = false; }
  }
}
function closeIntro() { introV.pause(); introEl.hidden = true; introMode = null; }
introV.addEventListener("ended", closeIntro);
introBtn("introClose").addEventListener("click", closeIntro);
introBtn("introStopAll").addEventListener("click", () => { closeIntro(); A.introStop(); });
introBtn("introSound").addEventListener("click", () => { introV.muted = false; introBtn("introSound").hidden = true; });
introBtn("introTap").addEventListener("click", () => { introV.muted = false; introBtn("introTap").hidden = true; introV.play().catch(() => {}); });

function handleIntro() {
  const it = (S.settings || {}).intro || {};
  // De eerste keer onthouden we alleen de huidige stand: wie de app later opent, krijgt een oude start niet te zien.
  if (introBase === undefined) { introBase = it.id || null; return; }
  if (it.on && it.id && it.id !== introBase && it.id !== introPlayed && Math.abs(Date.now() - (it.at || 0)) < INTRO_WINDOW) {
    introPlayed = it.id;
    openIntro("live");
  } else if (!it.on && introMode === "live") closeIntro();
}

function listenWagers() {
  if (unsubW) unsubW();
  unsubW = null;
  if (!S.me) return;
  const q = S.admin ? collection(db, "wagers") : query(collection(db, "wagers"), where("player", "==", S.me));
  unsubW = onSnapshot(q, snap => { S.wagers = snap.docs.map(d => ({ id: d.id, ...d.data() })); checkNotice(); render(); }, e => fail(e));
}
if (S.me) listenWagers();

// ---------- winstmelding ----------
function makeConfetti() {
  const em = ["🎉", "🪙", "❄️", "⭐", "🎄", "🏀"];
  let h = '<div class="conf">';
  for (let i = 0; i < 34; i++) h += `<span style="left:${Math.random() * 96}%;animation-delay:${(Math.random() * 1.4).toFixed(2)}s">${em[i % em.length]}</span>`;
  return h + "</div>";
}
function checkNotice() {
  if (S.admin || !S.me || S.notice) return;
  const seen = getSeen();
  const un = S.wagers.filter(w => (w.status === "won" || w.status === "lost") && !seen.includes(nkey(w)));
  if (un.length) { S.notice = un; S.confetti = un.some(w => w.status === "won") ? makeConfetti() : ""; }
}
function noticeView() {
  if (!S.notice) return "";
  const won = S.notice.filter(w => w.status === "won"), lost = S.notice.filter(w => w.status === "lost");
  const net = S.notice.reduce((s, w) => s + (w.net || 0), 0);
  const head = won.length ? "🎉 Je hebt gewonnen!" : "Helaas, deze keer niet";
  const lines = S.notice.map(w => {
    const b = S.bets.find(x => x.id === w.betId);
    const t = esc(w.title || b?.title || "");
    return w.status === "won"
      ? `<div style="margin:8px 0"><b class="pos">+${fmt(w.net)} LeCoins</b><div class="muted">${t}: ${esc(w.label)}</div></div>`
      : `<div style="margin:8px 0"><b class="neg">-${fmt(w.stake)} LeCoins</b><div class="muted">${t}: ${esc(w.label)}</div></div>`;
  }).join("");
  return `${S.confetti}<div class="modal"><div class="box"><h2>${head}</h2>
  <div style="font-size:22px;margin:6px 0">Netto: <b class="${net >= 0 ? "pos" : "neg"}">${net >= 0 ? "+" : ""}${fmt(net)}</b> LeCoins</div>
  ${lines}<div style="margin-top:12px"><button class="btn gold" data-a="closeNotice">Verder</button></div></div></div>`;
}

// ---------- render ----------
function typing() { const a = document.activeElement; return a && $app.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); }
function render() { if (typing()) { S.dirty = true; return; } S.dirty = false; paint(); }
function paint() {
  const err = S.err ? `<div class="err">${esc(S.err)}</div>` : "";
  let h;
  if (!S.me) h = loginView();
  else if (S.admin) h = adminView();
  else h = playerView();
  $app.innerHTML = `<div class="snow">🎄 ❄️ 🏀 ❄️ 🎄</div>` + err + h + noticeView();
  if (!S.me && S.loginFor) { const el = document.getElementById(S.loginFor === "__new" ? "f_newname" : "f_code"); if (el) el.focus(); }
}

function nameError(n) {
  if (n.length < 2 || n.length > 20) return "Kies een naam van 2 tot 20 tekens.";
  if (!/^[\p{L}\p{N} _.'-]+$/u.test(n) || /^\.+$/.test(n) || n.startsWith("__")) return "Gebruik alleen letters, cijfers en spaties in de naam.";
  if (norm(n) === "admin") return "Deze naam kan niet.";
  if (S.players.some(p => norm(p.name) === norm(n)) || Object.keys(DEFAULT_CODES).some(k => norm(k) === norm(n))) return "Deze naam bestaat al.";
  return "";
}

function loginView() {
  const lf = S.loginFor;
  const eb = S.loginErr ? `<div class="err">${esc(S.loginErr)}</div>` : "";
  if (lf === "__new") {
    return `<h1 style="text-align:center">Nieuw account</h1>
    <div class="card">${eb}<label>Jouw naam</label><input id="f_newname" value="${esc(F("f_newname"))}" autocomplete="off" autocapitalize="words" maxlength="20">
    <label>Kies een wachtwoord (minimaal 4 tekens)</label><input id="f_newcode" type="password" value="${esc(F("f_newcode"))}" autocomplete="new-password" autocapitalize="off" autocorrect="off">
    <div class="muted" style="margin-top:6px">Je start met ${START_COINS} LeCoins. Onthoud je wachtwoord, alleen de admin kan het wijzigen.</div>
    <div class="row" style="margin-top:12px"><button class="btn grey" data-a="backLogin">Terug</button><button class="btn gold" data-a="doNew">Account maken</button></div></div>`;
  }
  if (lf) {
    const adm = lf === "__admin", p = player(lf), claim = !adm && !(p?.code || DEFAULT_CODES[lf]);
    return `<h1 style="text-align:center">${adm ? "Admin" : esc(lf)}</h1>
    <div class="card">${eb}<label>${claim ? "Je hebt nog geen wachtwoord, kies er nu een (minimaal 4 tekens)" : "Wachtwoord"}</label>
    <input id="f_code" type="password" value="${esc(F("f_code"))}" autocomplete="off" autocapitalize="off" autocorrect="off">
    <div class="row" style="margin-top:12px"><button class="btn grey" data-a="backLogin">Terug</button><button class="btn gold" data-a="doLogin">${claim ? "Opslaan en inloggen" : "Inloggen"}</button></div></div>`;
  }
  const names = [...new Set([...Object.keys(DEFAULT_CODES), ...S.players.map(p => p.name)])];
  return `<h1 style="text-align:center">LeCoins Kerst NBA</h1>
  <p class="muted" style="text-align:center">Kies je naam. Nieuw hier? Maak een account.</p>
  <div class="names">${names.map(n => `<button class="name" data-a="pickName" data-n="${esc(n)}">${esc(n)}</button>`).join("")}
  <button class="name new" data-a="newAcc">+ Nieuw</button><button class="name adm" data-a="adminLogin">Admin</button></div>`;
}

function finishLogin(name, admin) {
  S.me = name; S.admin = admin; S.tab = null; S.notice = null; S.loginFor = null; S.loginErr = "";
  delete S.form.f_code; delete S.form.f_newname; delete S.form.f_newcode;
  localStorage.setItem("lc_me", name);
  if (admin) sessionStorage.setItem("lc_admin", "1"); else sessionStorage.removeItem("lc_admin");
  S.wagers = []; listenWagers(); render();
}

// ---------- ranglijsten ----------
const BOARDS = [
  ["saldo", "Tussenstand (saldo)", "🏀"],
  ["wins", "Scherpschutter: meeste gewonnen bets", "🎯"],
  ["hit", "Hitrate: percentage gewonnen", "📈"],
  ["big", "Grootste winst in één bet", "💰"],
  ["luck", "Gelukzak: hoogste winnende odds", "🍀"],
  ["risk", "Durfal: hoogste gemiddelde odds", "🔥"],
  ["loss", "Pechvogel: meeste coins verloren", "🌧️"]
];
function computeBoards(W, Pl) {
  const done = W.filter(w => w.status === "won" || w.status === "lost");
  const per = {};
  Pl.forEach(p => per[p.name] = { won: 0, lost: 0, big: 0, luck: 0, oddsSum: 0, lostSum: 0 });
  done.forEach(w => {
    const o = per[w.player]; if (!o) return;
    if (w.status === "won") { o.won++; o.big = Math.max(o.big, w.net || 0); o.luck = Math.max(o.luck, w.odds); }
    else { o.lost++; o.lostSum += w.stake; }
    o.oddsSum += w.odds;
  });
  const rows = (fn, ok) => Object.entries(per).filter(([n, o]) => ok(o)).map(([n, o]) => fn(n, o)).sort((a, b) => b.v - a.v);
  const any = o => o.won + o.lost > 0, B = {};
  B.saldo = [...Pl].sort((a, b) => b.coins - a.coins).map(p => ({ n: p.name, v: p.coins, t: fmt(p.coins) }));
  B.wins = rows((n, o) => ({ n, v: o.won, t: o.won + " gewonnen" }), any);
  B.hit = rows((n, o) => ({ n, v: o.won / (o.won + o.lost), t: Math.round(100 * o.won / (o.won + o.lost)) + "% (" + o.won + " van " + (o.won + o.lost) + ")" }), any);
  B.big = rows((n, o) => ({ n, v: o.big, t: "+" + fmt(o.big) }), o => o.won > 0);
  B.luck = rows((n, o) => ({ n, v: o.luck, t: o.luck.toFixed(2) + "x" }), o => o.won > 0);
  B.risk = rows((n, o) => ({ n, v: o.oddsSum / (o.won + o.lost), t: (o.oddsSum / (o.won + o.lost)).toFixed(2) + "x gemiddeld" }), any);
  B.loss = rows((n, o) => ({ n, v: o.lostSum, t: "-" + fmt(o.lostSum) }), o => o.lostSum > 0);
  return B;
}
function rankVisible() { const s = S.settings || {}; return !!(s.snap && Object.keys(s.snap).length && (s.final || BOARDS.some(b => s.visible && s.visible[b[0]]))); }
function finalView(snap) {
  const med = ["🥇", "🥈", "🥉"], top = (snap.saldo || []).slice(0, 3);
  const leaders = BOARDS.filter(b => b[0] !== "saldo").map(b => {
    const r = (snap[b[0]] || [])[0];

function computeStats() {

  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

  const bonus = sum(Pl, p => p.bonus || 0);

  add("Spelers in de plus", Pl.filter(p => p.coins > START_COINS + (p.bonus || 0)).length + " van " + Pl.length, "zonder bonus gerekend");
  const bs = best(live, w => w.stake); if (bs) add("Hoogste inzet", fmt(bs.stake) + " LeCoins", bs.player + " op " + ttl(bs) + ": " + bs.label);
  const bw = best(won, w => w.net || 0); if (bw) add("Grootste winst in één bet", "+" + fmt(bw.net), bw.player + ": " + ttl(bw) + " (" + bw.label + ")");
  const hl = best(won, w => w.odds); if (hl) add("Hoogste winnende odds", hl.odds.toFixed(2) + "x", hl.player + ": " + ttl(hl) + " (" + hl.label + ")");
  const bl = best(lost, w => w.stake); if (bl) add("Pijnlijkste verlies", "-" + fmt(bl.stake), bl.player + ": " + ttl(bl) + " (" + bl.label + ")");
  const byBet = {}; live.forEach(w => (byBet[w.betId] = byBet[w.betId] || []).push(w));
  const betRows = Object.entries(byBet).map(([id, ws]) => {

  const spl = best(multi.filter(r => r.share < 1), r => -r.share * 1000 + r.n); if (spl) add("Meest verdeelde bet", spl.title, spl.topN + " van " + spl.n + " koos " + spl.top);
  const allW = multi.filter(r => r.ws.every(w => w.status === "won")), allL = multi.filter(r => r.ws.every(w => w.status === "lost"));
  if (allW.length) add("Iedereen zat goed", allW[0].title, allW.length > 1 ? allW.length + " bets waar iedereen goed zat" : "");
  if (allL.length) add("Iedereen zat ernaast", allL[0].title, allL.length > 1 ? allL.length + " bets waar iedereen fout zat" : "");
  const sb = S.bets.filter(b => b.status === "settled" && b.options[b.winner]);
  const sur = best(sb, b => b.options[b.winner].odds);
  if (sur && sur.options[sur.winner].odds >= 2) add("Grootste verrassing", sur.options[sur.winner].label + " (" + sur.options[sur.winner].odds.toFixed(2) + "x)", sur.title);
  const B = computeBoards(W, Pl);
  [["wins", "Scherpschutter"], ["hit", "Beste hitrate"], ["luck", "Gelukzak"], ["risk", "Durfal"], ["loss", "Pechvogel"]].forEach(([id, k]) => { const r = (B[id] || [])[0]; if (r) add(k, r.n, r.t); });
  const fav = {};
  live.forEach(w => {
    const b = S.bets.find(x => x.id === w.betId); if (!b) return;
    const mn = Math.min(...b.options.map(o => o.odds)), fi = b.options.findIndex(o => o.odds === mn);
    const o = fav[w.player] = fav[w.player] || { n: 0, f: 0 }; o.n++; if (w.idx === fi) o.f++;
  });
  const fr = Object.entries(fav).filter(([n, o]) => o.n >= 3).map(([n, o]) => ({ n, v: o.f / o.n }));
  const safe = best(fr, r => r.v), risky = best(fr, r => -r.v);

  if (risky && risky.n !== safe?.n) add("Grootste gokker", risky.n, Math.round(risky.v * 100) + "% van de inzetten op de favoriet");

  const pRows = Pl.map(p => {

    return [p.name, p.coins, p.bonus || 0, p.coins - START_COINS - (p.bonus || 0), ws.length, wn.length, d.length - wn.length, d.length ? Math.round(100 * wn.length / d.length) + "%" : "",
      sum(ws, w => w.stake), ws.length ? Math.round(sum(ws, w => w.stake) / ws.length) : 0, ws.length ? Number((sum(ws, w => w.odds) / ws.length).toFixed(2)) : "",
      wn.length ? Math.max(...wn.map(w => w.net || 0)) : 0, sum(pend.filter(w => w.player === p.name), w => w.stake)];
  });
  const gHead = ["Wedstrijd", "Start", "Gesloten", "Eindstand", "Inzetten", "Totaal ingezet", "Netto spelers", "Uit K1", "Uit K2", "Uit K3", "Uit K4", "Uit OT", "Thuis K1", "Thuis K2", "Thuis K3", "Thuis K4", "Thuis OT"];
  const gRows = S.games.map(g => {
    const ws = live.filter(w => w.gameId === g.id), r = g.result;
    return [gLabel(g), isGen(g) || !g.start ? "" : new Date(g.start).toLocaleString("nl-NL"), g.closed ? "ja" : "nee", r ? r.A + " - " + r.H : "", ws.length, sum(ws, w => w.stake), sum(ws.filter(w => w.status === "won" || w.status === "lost"), w => w.net || 0),
      ...(r ? [...r.a, r.ao || 0, ...r.h, r.ho || 0] : Array(10).fill(""))];
  });
  return { tiles, pHead, pRows, gHead, gRows };
}

// ---------- odds van ESPN ----------
const amDec = a => a > 0 ? 1 + a / 100 : 1 + 100 / (-a);
const fairAm = (a, b) => fair2(amDec(a), amDec(b)).map(x => Math.round(x * 100) / 100);
const dig = (o, path) => path.split(".").reduce((x, k) => (x == null ? undefined : x[k]), o);
const amNum = v => { if (v == null) return null; const t = String(v).trim().toUpperCase(); if (t === "EVEN") return 100; const n = parseFloat(t.replace(/[^0-9.+-]/g, "")); return isNaN(n) ? null : n; };
const firstNum = (...vals) => { for (const v of vals) { const n = amNum(v); if (n !== null) return n; } return null; };
function parseEspnOdds(o, homeAbbr) {
  const r = {};
  r.mlAway = firstNum(dig(o, "moneyline.away.close.odds"), dig(o, "awayTeamOdds.moneyLine"), dig(o, "moneyline.away.current.odds"));
  r.mlHome = firstNum(dig(o, "moneyline.home.close.odds"), dig(o, "homeTeamOdds.moneyLine"), dig(o, "moneyline.home.current.odds"));
  let sh = firstNum(dig(o, "pointSpread.home.close.line"), dig(o, "pointSpread.home.current.line"));
  if (sh === null && typeof o.details === "string") {
    const m = o.details.match(/^([A-Za-z.]+)\s*([+-]?\d+(?:\.\d+)?)/);
    if (m) { const v = parseFloat(m[2]); sh = m[1].toUpperCase() === String(homeAbbr || "").toUpperCase() ? v : -v; }
  }
  r.spreadHome = sh;
  r.spAway = firstNum(dig(o, "pointSpread.away.close.odds"), dig(o, "awayTeamOdds.spreadOdds"));
  r.spHome = firstNum(dig(o, "pointSpread.home.close.odds"), dig(o, "homeTeamOdds.spreadOdds"));
  r.total = firstNum(dig(o, "total.over.close.line"), dig(o, "total.over.current.line"), o.overUnder);
  r.over = firstNum(dig(o, "total.over.close.odds"), o.overOdds);
  r.under = firstNum(dig(o, "total.under.close.odds"), o.underOdds);
  return r;
}
async function updateOddsFor(g) {
  const ymd = new Date(g.start).toLocaleDateString("en-CA", { timeZone: "America/New_York" }).replaceAll("-", "");
  let j;
  try { j = await (await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + ymd)).json(); }
  catch (e) { return ["Ophalen bij ESPN lukte niet (" + (e.message || e) + "). Pas de odds zelf aan."]; }
  const ev = (j.events || []).find(e => { const nm = (e.competitions?.[0]?.competitors || []).map(x => norm(x.team?.name)); return nm.includes(norm(g.away)) && nm.includes(norm(g.home)); });
  if (!ev) return ["Wedstrijd niet gevonden bij ESPN voor " + ymd + "."];
  const comp = ev.competitions[0], o = comp.odds && comp.odds[0];
  if (!o) return ["ESPN heeft voor deze wedstrijd nog geen odds. Die staan vaak pas op de dag zelf online."];
  const home = comp.competitors.find(x => norm(x.team?.name) === norm(g.home));
  const r = parseEspnOdds(o, home?.team?.abbreviation);
  const msgs = ["Bron: ESPN (" + (o.provider?.name || "onbekende aanbieder") + ")."];
  const capO = x => Math.min(MAX_ODDS, Math.max(1.01, Math.round(x * 100) / 100));
  const hasW = b => S.wagers.some(w => w.betId === b.id && w.status === "pending");
  const show = (old, nw) => nw.map((o2, i) => o2.label + " " + o2.odds.toFixed(2) + " (was " + Number(old[i].odds).toFixed(2) + ")").join(", ");
  let done = 0;
  for (const b of S.bets.filter(x => x.gameId === g.id && (x.status === "open" || x.status === "locked"))) {
    let nw = null, extra = {};
    if (b.type === "winner" && r.mlAway !== null && r.mlHome !== null) {
      const ia = b.options.findIndex(x => norm(x.label) === norm(g.away)), ih = b.options.findIndex(x => norm(x.label) === norm(g.home));
      if (ia < 0 || ih < 0) { msgs.push("Winnaar: teamnamen in de bet kloppen niet, overgeslagen."); continue; }
      const [x, y] = fair2(amDec(r.mlAway), amDec(r.mlHome));
      nw = b.options.map((x0, i) => ({ label: x0.label, odds: i === ia ? capO(x) : i === ih ? capO(y) : x0.odds }));
    } else if (b.type === "spread" && r.spreadHome !== null) {
      if (b.spreadHome !== r.spreadHome && hasW(b)) { msgs.push("Spread niet aangepast: er staan al inzetten op de lijn " + sg(b.spreadHome) + "."); continue; }
      const [x, y] = fair2(amDec(r.spAway ?? -110), amDec(r.spHome ?? -110));
      nw = [{ label: g.away + " " + sg(-r.spreadHome), odds: capO(x) }, { label: g.home + " " + sg(r.spreadHome), odds: capO(y) }];
      extra = { spreadHome: r.spreadHome };
    } else if (b.type === "total" && r.total !== null) {
      if (b.line !== r.total && hasW(b)) { msgs.push("Over/under niet aangepast: er staan al inzetten op de lijn " + b.line + "."); continue; }
      const [x, y] = fair2(amDec(r.over ?? -110), amDec(r.under ?? -110));
      nw = [{ label: "Over " + r.total, odds: capO(x) }, { label: "Onder " + r.total, odds: capO(y) }];
      extra = { line: r.total };
    }
    if (!nw) continue;
    try { await updateDoc(doc(db, "bets", b.id), { options: nw, ...extra }); msgs.push(b.title + ": " + show(b.options, nw)); done++; }
    catch (e) { msgs.push(b.title + ": opslaan mislukt (" + (e.message || e) + ")"); }
  }
  if (!done) msgs.push("Er is niets aangepast. ESPN gaf geen bruikbare lijnen voor winnaar, spread of over/under.");
  return msgs;
}

// ---------- sjablonen ----------
const TPL_NAMES = [["winner", "Winnaar"], ["spread", "Spread"], ["total", "Over/under totaal"], ["margin", "Winstmarge"], ["q1", "Eerste kwart"], ["half1", "Eerste helft"], ["ot", "Overtime"], ["bestq", "Kwart met meeste punten"], ["first", "Eerste score"], ["prop", "Speler: punten"], ["custom", "Eigen bet"]];
const TPL_LINE = { spread: "-1.5", total: "225.5", prop: "20.5" };
function tpl(k, g, line, pl) {
  const a = g.away, h = g.home, L = parseFloat(String(line).replace(",", "."));
  switch (k) {
    case "winner": return { type: "winner", title: "Winnaar wedstrijd", opts: `${a} | 2.00\n${h} | 2.00`, extra: {} };
    case "spread": return { type: "spread", title: "Spread (puntenverschil)", opts: `${a} ${sg(-L)} | 1.95\n${h} ${sg(L)} | 1.95`, extra: { spreadHome: L } };
    case "total": return { type: "total", title: "Totaal aantal punten", opts: `Over ${L} | 2.00\nOnder ${L} | 2.00`, extra: { line: L } };
    case "margin": return { type: "margin", title: "Met hoeveel punten wordt de wedstrijd gewonnen?", opts: "1 tot 5 punten | 3.70\n6 tot 10 punten | 4.20\n11 tot 15 punten | 5.30\n16 of meer punten | 3.40", extra: {} };
    case "q1": return { type: "q1", title: `Scoort ${a} meer punten dan ${h} in het eerste kwart?`, opts: "Ja | 2.10\nNee | 1.90", extra: {} };
    case "half1": return { type: "half1", title: `Scoort ${a} meer punten dan ${h} in de eerste helft?`, opts: "Ja | 2.05\nNee | 1.95", extra: {} };
    case "ot": return { type: "ot", title: "Gaat de wedstrijd naar overtime?", opts: "Ja | 14.00\nNee | 1.07", extra: {} };
    case "bestq": return { type: "bestq", title: "In welk kwart vallen de meeste punten (beide teams samen)? Bij gelijk telt het vroegste kwart.", opts: "Kwart 1 | 4.00\nKwart 2 | 4.00\nKwart 3 | 4.00\nKwart 4 | 4.00", extra: {} };
    case "first": return { type: "first", title: "Welk team scoort als eerste?", opts: `${a} | 2.00\n${h} | 2.00`, extra: {} };
    case "prop": return { type: "prop", title: `${pl || "Speler"}: totaal aantal punten`, opts: `Over ${L} | 2.00\nOnder ${L} | 2.00`, extra: { line: L, player: pl || "", match: norm(pl || "") } };
    default: return { type: "custom", title: "", opts: "Optie A | 2.00\nOptie B | 2.00", extra: {} };
  }
}

// ---------- uitslagen berekenen ----------
function readRes(g) {
  const n = id => { const v = F(id, ""); return v === "" ? NaN : Number(v); };
  const a = [1, 2, 3, 4].map(q => n(`f_r_${g.id}_a_${q}`)), h = [1, 2, 3, 4].map(q => n(`f_r_${g.id}_h_${q}`));
  if ([...a, ...h].some(isNaN)) return null;
  const ao = n(`f_r_${g.id}_a_o`) || 0, ho = n(`f_r_${g.id}_h_o`) || 0;
  const A = a.reduce((s, x) => s + x, 0) + ao, H = h.reduce((s, x) => s + x, 0) + ho;
  if (A === H) return { err: "Gelijke eindstand. Vul de overtime in." };
  return { a, h, ao, ho, A, H };
}
function outcome(bet, R, g) {
  switch (bet.type) {
    case "winner": return R.A > R.H ? 0 : 1;
    case "spread": { const s = R.H + bet.spreadHome; return s === R.A ? -1 : s > R.A ? 1 : 0; }
    case "total": { const s = R.A + R.H; return s === bet.line ? -1 : s > bet.line ? 0 : 1; }
    case "margin": { const d = Math.abs(R.A - R.H); return d <= 5 ? 0 : d <= 10 ? 1 : d <= 15 ? 2 : 3; }
    case "q1": return R.a[0] > R.h[0] ? 0 : 1;
    case "half1": return R.a[0] + R.a[1] > R.h[0] + R.h[1] ? 0 : 1;
    case "ot": return R.ao > 0 || R.ho > 0 ? 0 : 1;
    case "bestq": { const t = [0, 1, 2, 3].map(i => R.a[i] + R.h[i]); return t.indexOf(Math.max(...t)); }
    case "first": { const f = F(`f_first_${g.id}`, ""); return f === "a" ? 0 : f === "h" ? 1 : null; }
    case "prop": { const v = F(`f_p_${g.id}_${bet.id}`, ""); if (v === "") return null; const p = Number(v); return p === bet.line ? -1 : p > bet.line ? 0 : 1; }
    default: return null;
  }
}
function gameBetsToSettle(g) { return S.bets.filter(b => b.gameId === g.id && b.published !== false && (b.status === "open" || b.status === "locked")); }

async function settleMany(items) {
  const ops = [], net = {};
  for (const { bet, idx } of items) {
    for (const w of S.wagers.filter(x => x.betId === bet.id && x.status === "pending")) {
      let status, n;
      if (idx === -1) { status = "void"; n = 0; }
      else if (w.idx === idx) { status = "won"; n = payoutOf(w) - w.stake; }
      else { status = "lost"; n = -w.stake; }
      const payout = status === "won" ? payoutOf(w) : status === "void" ? w.stake : 0;
      ops.push(b => b.update(doc(db, "wagers", w.id), { status, net: n, payout, settledAt: Date.now() }));
      net[w.player] = (net[w.player] || 0) + n;
    }
    ops.push(b => b.update(doc(db, "bets", bet.id), idx === -1 ? { status: "void", winner: null } : { status: "settled", winner: idx }));
  }
  for (const [p, n] of Object.entries(net)) if (n) ops.push(b => b.update(doc(db, "players", p), { coins: increment(n) }));
  for (let i = 0; i < ops.length; i += 400) { const batch = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(batch)); await batch.commit(); }
}

    try { const batch = writeBatch(db); S.bets.filter(b => b.gameId === d.g && b.published === false).forEach(b => batch.update(doc(db, "bets", b.id), { published: true })); await batch.commit(); } catch (e) { fail(e); }
  },
  async lock(d) { try { await updateDoc(doc(db, "bets", d.b), { status: d.v }); } catch (e) { fail(e); } },
  async settle(d) {
    const b = S.bets.find(x => x.id === d.b), idx = +d.i;
    if (!confirm("Winnaar: " + b.options[idx].label + ". Uitbetalen?")) return;
    try { await settleMany([{ bet: b, idx }]); } catch (e) { fail(e); }
  },
  async voidBet(d) {
    if (!confirm("Bet laten vervallen? Alle inzetten gaan terug.")) return;
    try { await settleMany([{ bet: S.bets.find(x => x.id === d.b), idx: -1 }]); } catch (e) { fail(e); }
  },
  async confirmRes(d) {
    const g = gameOf(d.g), R = readRes(g);
    if (!R || R.err) return;
    const items = gameBetsToSettle(g).map(b => ({ bet: b, idx: outcome(b, R, g) })).filter(x => x.idx !== null);
    if (!items.length) return;
    if (!confirm(items.length + " bets uitbetalen voor " + gLabel(g) + " (" + R.A + " - " + R.H + ")? Je kunt later nog corrigeren.")) return;
    try { await updateDoc(doc(db, "games", g.id), { result: { a: R.a, h: R.h, ao: R.ao, ho: R.ho, A: R.A, H: R.H, at: Date.now() } }); await settleMany(items); S.res[g.id] = "Uitbetaald."; render(); } catch (e) { fail(e); }
  },
  async undoSettle(d) {
    const b = S.bets.find(x => x.id === d.b);
    if (!confirm("Uitbetaling van deze bet terugdraaien? Daarna kun je opnieuw uitbetalen. Saldo's kunnen tijdelijk onder nul komen als winst al is ingezet.")) return;
    try {
      const ops = [], net = {};
      for (const w of S.wagers.filter(x => x.betId === b.id && x.status !== "pending")) {
        net[w.player] = (net[w.player] || 0) - (w.net || 0);
        ops.push(bt => bt.update(doc(db, "wagers", w.id), { status: "pending", net: null, payout: null, settledAt: null }));
      }
      ops.push(bt => bt.update(doc(db, "bets", b.id), { status: "open", winner: null }));
      for (const [p, n] of Object.entries(net)) if (n) ops.push(bt => bt.update(doc(db, "players", p), { coins: increment(n) }));
      const batch = writeBatch(db); ops.forEach(f => f(batch)); await batch.commit();
    } catch (e) { fail(e); }
  },
  async delBet(d) {
    if (!confirm("Bet verwijderen? Openstaande inzetten verdwijnen zonder uitbetaling.")) return;
    try { for (const w of S.wagers.filter(x => x.betId === d.b)) await deleteDoc(doc(db, "wagers", w.id)); await deleteDoc(doc(db, "bets", d.b)); } catch (e) { fail(e); }
  },
  async fetchRes(d) {
    const g = gameOf(d.g), id = g.id;
    const ymd = new Date(g.start).toLocaleDateString("en-CA", { timeZone: "America/New_York" }).replaceAll("-", "");
    S.res[id] = "Bezig met ophalen..."; render();
    let msg = "";
    try {
      const r = await fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=" + ymd);
      const j = await r.json();
      const ev = (j.events || []).find(e => { const c = e.competitions?.[0]?.competitors || []; const nm = c.map(x => norm(x.team?.name)); return nm.includes(norm(g.away)) && nm.includes(norm(g.home)); });
      if (!ev) throw new Error("Wedstrijd niet gevonden bij ESPN voor " + ymd);
      const comp = ev.competitions[0], cs = comp.competitors;
      const ca = cs.find(x => norm(x.team?.name) === norm(g.away)), ch = cs.find(x => norm(x.team?.name) === norm(g.home));
      const done = !!(comp.status?.type?.completed ?? ev.status?.type?.completed);
      [["a", ca], ["h", ch]].forEach(([t, c]) => {
        const ls = (c.linescores || []).map(x => Number(x.value ?? x.displayValue));
        [0, 1, 2, 3].forEach(i => { S.form[`f_r_${id}_${t}_${i + 1}`] = ls[i] === undefined || isNaN(ls[i]) ? "" : String(ls[i]); });
        const ot = ls.slice(4).reduce((s, x) => s + (isNaN(x) ? 0 : x), 0);
        S.form[`f_r_${id}_${t}_o`] = ot ? String(ot) : "";
      });
      msg = done ? "Eindstand opgehaald van ESPN. Controleer het en bevestig." : "Let op: ESPN meldt dat de wedstrijd nog niet is afgelopen. Dit is een tussenstand.";
      try {
        const sr = await fetch("https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=" + ev.id);
        const sum = await sr.json();
        const pts = {};
        (sum.boxscore?.players || []).forEach(tp => {
          const st = tp.statistics?.[0]; if (!st) return;
          const i = (st.labels || []).indexOf("PTS"); if (i < 0) return;
          (st.athletes || []).forEach(at => { pts[norm(at.athlete?.displayName)] = at.stats?.[i]; });
        });
        let found = 0;
        S.bets.filter(b => b.gameId === id && b.type === "prop").forEach(b => {
          const key = Object.keys(pts).find(n => b.match && n.includes(b.match));
          if (key !== undefined && pts[key] !== undefined && pts[key] !== "") { S.form[`f_p_${id}_${b.id}`] = String(pts[key]); found++; }
        });
        const sp = (sum.plays || []).find(p => p.scoringPlay);
        const tid = sp?.team?.id;
        if (tid) { S.form[`f_first_${id}`] = tid === ca.team?.id ? "a" : tid === ch.team?.id ? "h" : ""; }
        msg += " Spelerspunten gevonden: " + found + (tid ? ", eerste score ingevuld." : ", eerste score niet gevonden, kies die zelf.");
      } catch (e2) { msg += " Spelerspunten en eerste score konden niet worden opgehaald, vul die zelf in."; }
    } catch (e) { msg = "Ophalen lukte niet (" + (e.message || e) + "). Vul de uitslag zelf in."; }
    S.res[id] = msg; render();
  },
  async seedXmas() {
    if (!confirm("De kerstwedstrijden laden of bijwerken? Bestaande bets en odds blijven zoals ze zijn.")) return;
    try {
      let gen = S.games.find(isGen);
      if (!gen) { await setDoc(doc(db, "games", GENERAL_ID), { kind: "general", away: "Algemeen", home: "", start: 0, closed: false }); }
      await seedGameList(XMAS);
      const haveG = S.bets.filter(b => b.gameId === GENERAL_ID);
      let n = 0;
      for (const s of GENERAL_BETS) {
        if (haveG.some(b => b.key === s.key)) continue;
        await addDoc(collection(db, "bets"), { gameId: GENERAL_ID, key: s.key, type: "custom", title: s.title, options: s.options.map(([label, odds]) => ({ label, odds })), maxStake: MAX_STAKE, status: "open", published: false, order: 100 + n++, created: Date.now() });
      }
      S.err = ""; render();
    } catch (e) { fail(e); }
  },
  async setCoins(d) { const v = parseInt(F("f_c_" + d.n)); if (isNaN(v)) { S.err = "Vul een getal in."; return render(); }
    try { await updateDoc(doc(db, "players", d.n), { coins: v }); delete S.form["f_c_" + d.n]; render(); } catch (e) { fail(e); } },
  async addPlayer() {
    const n = F("f_newp").trim(), c = F("f_newpc").trim(), ne = nameError(n);
    if (ne) { S.err = ne; return render(); }
    if (c.length < 4) { S.err = "Een wachtwoord heeft minimaal 4 tekens."; return render(); }
    try { await setDoc(doc(db, "players", n), { name: n, coins: START_COINS, code: c, created: Date.now() }); S.form.f_newp = S.form.f_newpc = ""; S.err = ""; render(); } catch (e) { fail(e); }
  },
  async delPlayer(d) {
    if (!confirm(d.n + " en alle inzetten van deze speler verwijderen?")) return;
    try { for (const w of S.wagers.filter(x => x.player === d.n)) await deleteDoc(doc(db, "wagers", w.id)); await deleteDoc(doc(db, "players", d.n)); } catch (e) { fail(e); }
  },
  async setCode(d) {
    const c = F("f_pw_" + d.n).trim();
    if (c.length < 4) { S.err = "Een wachtwoord heeft minimaal 4 tekens."; return render(); }
    try { await updateDoc(doc(db, "players", d.n), { code: c }); delete S.form["f_pw_" + d.n]; S.err = ""; render(); } catch (e) { fail(e); }
  },
  async bonus(d) {
    const v = parseInt(F("f_b_" + d.n));
    if (!(v > 0)) { S.err = "Vul een bonus groter dan 0 in."; return render(); }
    if (!confirm(v + " LeCoins bonus geven aan " + d.n + "?")) return;
    try { await updateDoc(doc(db, "players", d.n), { coins: increment(v), bonus: increment(v) }); delete S.form["f_b_" + d.n]; S.err = ""; render(); } catch (e) { fail(e); }
  },
  async bonusAll() {
    const amt = parseInt(F("f_ba", "200")), lim = parseInt(F("f_bt", "100"));
    if (!(amt > 0) || !(lim > 0)) { S.err = "Vul een bonus en een drempel groter dan 0 in."; return render(); }
    const pend = {}; S.wagers.filter(w => w.status === "pending").forEach(w => pend[w.player] = (pend[w.player] || 0) + w.stake);
    const t = S.players.filter(p => p.coins - (pend[p.name] || 0) < lim);
    if (!t.length) { S.err = "Niemand heeft minder dan " + lim + " beschikbare LeCoins."; return render(); }
    if (!confirm(amt + " LeCoins bonus geven aan: " + t.map(p => p.name).join(", ") + "?")) return;
    try { const batch = writeBatch(db); t.forEach(p => batch.update(doc(db, "players", p.id), { coins: increment(amt), bonus: increment(amt) })); await batch.commit(); S.err = ""; render(); } catch (e) { fail(e); }
  },
  async toggleVis(d) {
    const v = { ...((S.settings || {}).visible || {}) }; v[d.id] = !v[d.id];
    try { await setDoc(doc(db, "settings", "main"), { visible: v }, { mergeFields: ["visible"] }); } catch (e) { fail(e); }
  },
  async introPlay() {
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    try { await setDoc(doc(db, "settings", "main"), { intro: { on: true, at: Date.now(), id } }, { mergeFields: ["intro"] }); S.err = ""; } catch (e) { fail(e); }
  },
  async introStop() {
    const it = (S.settings || {}).intro || {};
    try { await setDoc(doc(db, "settings", "main"), { intro: { ...it, on: false } }, { mergeFields: ["intro"] }); } catch (e) { fail(e); }
  },
  introPreview() { openIntro("preview"); },
  async publishRank() {
    try { await setDoc(doc(db, "settings", "main"), { snap: computeBoards(S.wagers, S.players), snapAt: Date.now() }, { mergeFields: ["snap", "snapAt"] }); S.err = ""; } catch (e) { fail(e); }
  },
  async toggleFinal() {
    const on = !(S.settings || {}).final;
    try {
      if (on) await setDoc(doc(db, "settings", "main"), { snap: computeBoards(S.wagers, S.players), snapAt: Date.now() }, { mergeFields: ["snap", "snapAt"] });
      await setDoc(doc(db, "settings", "main"), { final: on }, { mergeFields: ["final"] });
    } catch (e) { fail(e); }
  },
  async seedTest() {
    if (!confirm("De testwedstrijd Heat @ Clippers laden? Alle bets behalve de speler-prop staan direct open voor spelers.")) return;
    try { await seedGameList(TESTGAMES); S.err = ""; render(); } catch (e) { fail(e); }
  },
  async fetchOdds(d) {
    const g = gameOf(d.g); S.oddsMsg[g.id] = ["Bezig met ophalen..."]; render();
    S.oddsMsg[g.id] = await updateOddsFor(g); render();
  },
  async fetchOddsAll() {
    const gs = S.games.filter(g => !isGen(g) && !g.closed);
    if (!gs.length) { S.err = "Geen open wedstrijden."; return render(); }
    gs.forEach(g => S.oddsMsg[g.id] = ["Bezig met ophalen..."]); render();
    for (const g of gs) { S.oddsMsg[g.id] = await updateOddsFor(g); render(); }
  },
  async exportXlsx() {
    const tables = exportTables();
    try {
      const X = await loadXLSX(), wb = X.utils.book_new();
      tables.forEach(([n, rows]) => X.utils.book_append_sheet(wb, X.utils.aoa_to_sheet(rows), n));
      X.writeFile(wb, "lecoins-export-" + new Date().toISOString().slice(0, 10) + ".xlsx"); S.err = "";
    } catch (e) {
      const csv = tables.map(([n, rows]) => n + "\n" + rows.map(r => r.map(c => '"' + String(c ?? "").replace(/"/g, '""') + '"').join(";")).join("\n")).join("\n\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = "lecoins-export.csv"; document.body.appendChild(a); a.click(); a.remove();
      S.err = "De Excel-export lukte niet (" + (e.message || e) + "). In plaats daarvan is een CSV-bestand gedownload.";
    }
    render();
  },
  async wipe() {
    if (!confirm("Alle inzetten wissen, alle saldo's terug naar " + START_COINS + ", alle bets en wedstrijden weer openzetten? Wedstrijden en bets blijven staan.")) return;
    try {
      const ops = [];
      S.wagers.forEach(w => ops.push(b => b.delete(doc(db, "wagers", w.id))));
      S.players.forEach(p => ops.push(b => b.update(doc(db, "players", p.id), { coins: START_COINS, bonus: 0 })));
      ops.push(b => b.set(doc(db, "settings", "main"), { snap: {}, snapAt: 0, final: false }, { mergeFields: ["snap", "snapAt", "final"] }));
      S.bets.filter(b => b.status !== "open").forEach(x => ops.push(b => b.update(doc(db, "bets", x.id), { status: "open", winner: null })));
      S.games.filter(g => g.closed).forEach(x => ops.push(b => b.update(doc(db, "games", x.id), { closed: false })));
      for (let i = 0; i < ops.length; i += 400) { const batch = writeBatch(db); ops.slice(i, i + 400).forEach(f => f(batch)); await batch.commit(); }
    } catch (e) { fail(e); }
  },
  async resetAll() { if (!confirm("Iedereen terug naar " + START_COINS + " LeCoins?")) return;
    try { const batch = writeBatch(db); S.players.forEach(p => batch.update(doc(db, "players", p.id), { coins: START_COINS })); await batch.commit(); } catch (e) { fail(e); } }
};

document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t || t.tagName === "SELECT") return;
  document.activeElement?.blur?.();
  A[t.dataset.a]?.(t.dataset);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id?.startsWith("f_")) S.form[t.id] = t.value;
  if (t.dataset?.a === "tpl") { document.activeElement?.blur?.(); A.tpl(t.dataset); }
  else if (t.dataset?.refill) refill(t.dataset.refill);
  else if (t.id?.startsWith("f_first_")) { document.activeElement?.blur?.(); render(); }
  else if (t.id?.startsWith("f_r_") || t.id?.startsWith("f_p_")) S.dirty = true;
});
document.addEventListener("input", e => { if (e.target.id?.startsWith("f_")) S.form[e.target.id] = e.target.value; if (e.target.id === "stake") S.stake = e.target.value; });
document.addEventListener("focusout", () => { setTimeout(() => { if (S.dirty && !typing()) render(); }, 350); });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const id = e.target.id;
  if (id === "f_code") { e.preventDefault(); e.target.blur(); A.doLogin(); }
  else if (id === "f_newname") { e.preventDefault(); document.getElementById("f_newcode")?.focus(); }
  else if (id === "f_newcode") { e.preventDefault(); e.target.blur(); A.doNew(); }
});
render();
</script>
</body>
</html>
